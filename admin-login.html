<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - LuxBiz Hotel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            padding: 2.5rem 2rem;
        }

        .login-card .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-card .logo img {
            width: 80px;
            height: auto;
        }

        .login-card .logo h2 {
            color: #333;
            font-size: 1.3rem;
            margin-top: 0.8rem;
        }

        .login-card .logo p {
            color: #999;
            font-size: 0.85rem;
            margin-top: 0.3rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            color: #555;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #bbb;
            font-size: 0.9rem;
        }

        .input-wrap input {
            width: 100%;
            padding: 10px 12px 10px 38px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.2s;
            outline: none;
        }

        .input-wrap input:focus {
            border-color: #b8860b;
        }

        .login-btn {
            width: 100%;
            padding: 11px;
            background: #b8860b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background 0.2s;
        }

        .login-btn:hover {
            background: #9a7209;
        }

        .error-msg {
            background: #fef2f2;
            color: #b91c1c;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }

        .error-msg.show { display: block; }

        .demo-box {
            background: #f8f8f5;
            border: 1px solid #e8e5d8;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1.5rem;
            text-align: center;
        }

        .demo-box p {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 0.3rem;
        }

        .demo-box code {
            font-size: 0.85rem;
            color: #b8860b;
            font-weight: 600;
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: #b8860b;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .back-link a:hover { text-decoration: underline; }

        @media (max-width: 480px) {
            .login-card { padding: 2rem 1.5rem; }
            .login-card .logo h2 { font-size: 1.15rem; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <img src="images/logo.png" alt="LuxBiz Hotel">
            <h2>Admin Panel</h2>
            <p>Sign in to manage your hotel</p>
        </div>

        <div class="error-msg" id="errorMsg">Invalid username or password</div>

        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <div class="input-wrap">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="Enter username" required autocomplete="username">
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrap">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
                </div>
            </div>
            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div class="demo-box">
            <p>Demo credentials</p>
            <code>admin / admin123</code>
        </div>

        <div class="back-link">
            <a href="index.html"><i class="fas fa-arrow-left"></i> Back to website</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (username === 'admin' && password === 'admin123') {
                localStorage.setItem('isAdminLoggedIn', 'true');
                localStorage.setItem('adminUsername', username);
                window.location.href = 'admin.html';
            } else {
                document.getElementById('errorMsg').classList.add('show');
                setTimeout(() => document.getElementById('errorMsg').classList.remove('show'), 3000);
            }
        });
    </script>
</body>
</html>
